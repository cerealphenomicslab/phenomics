  title_pl: Dwa nowe projekty OPUS finansowane przez NCN
  title_en: Two new OPUS projects funded by the National Science Centre
  text_pl: Projekty OPUS 27 i OPUS 28 dotyczą długich niekodujących RNA w sygnalizacji stresowej oraz roli antocyjanów w architekturze korzeni i pędów jęczmienia.
  text_en: The OPUS 27 and OPUS 28 projects address long non-coding RNAs in stress signalling and the role of anthocyanins in barley root and shoot architecture.
