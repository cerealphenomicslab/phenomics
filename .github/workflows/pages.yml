# Buduje stronę Jekyllem i publikuje ją na GitHub Pages przy każdym pushu do main.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:          # w PR tylko budowanie (sprawdzenie), bez publikacji
  schedule:
    - cron: "17 4 * * 1"   # co poniedziałek rano: odświeżenie publikacji z ORCID
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fetch publications from ORCID
        run: python3 tools/fetch_publications.py
        continue-on-error: true
      - id: pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
