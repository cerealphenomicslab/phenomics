- date: 2026-11-08
  title_pl: Praca o melatoninie przyjęta do druku w Plant and Soil
  title_en: Melatonin paper accepted in Plant and Soil
  text_pl: Nasza praca o wpływie melatoniny na architekturę systemu korzeniowego jęczmienia została przyjęta do druku w czasopiśmie Plant and Soil. To efekt badań prowadzonych w projekcie NCN OPUS 18 (2019/35/B/NZ9/00208).
  text_en: Our paper on the effect of melatonin on barley root system architecture has been accepted for publication in Plant and Soil. It presents results of the NCN OPUS 18 project (2019/35/B/NZ9/00208).
