- date: 2026-11-08
  journal: Plant and Soil
  title_pl: Praca o melatoninie przyjęta do druku w Plant and Soil
  title_en: Melatonin paper accepted in Plant and Soil
  text_pl: Praca dr. inż. Sebastiana Szczepańskiego i współpracowników o wpływie melatoniny na architekturę systemu korzeniowego jęczmienia została przyjęta do druku w czasopiśmie Plant and Soil. To efekt badań prowadzonych w projekcie NCN OPUS 18 (2019/35/B/NZ9/00208).
  text_en: The paper by Dr. Sebastian Szczepański and co-workers on the effect of melatonin on barley root system architecture has been accepted for publication in Plant and Soil. It presents results of the NCN OPUS 18 project (2019/35/B/NZ9/00208).
- date: 2026-09-01
  journal: Scientific Reports
  title_pl: Nowa publikacja w Scientific Reports
  title_en: New paper in Scientific Reports
  text_pl: W Scientific Reports ukazała się publikacja dr. Michała Kempy i współpracowników, przygotowana w ramach projektu NCN OPUS 21 (2021/41/B/NZ9/02576).
  text_en: A paper by Dr. Michał Kempa and co-workers, based on research from the NCN OPUS 21 project (2021/41/B/NZ9/02576), has been published in Scientific Reports.
  link: https://doi.org/10.1038/s41598-026-69888-3
- date: 2026-02-02
  journal: Metabolomics
  title_pl: Nowa publikacja w czasopiśmie Metabolomics
  title_en: New paper in Metabolomics
  text_pl: W czasopiśmie Metabolomics ukazała się praca dr. Michała Kempy i współpracowników poświęcona strategiom metabolicznym, którymi jęczmień odpowiada na stres, oraz ich skutkom dla fenotypu roślin.
  text_en: A paper by Dr. Michał Kempa and co-workers on the metabolic strategies barley uses to respond to stress, and their consequences for plant phenotype, has been published in Metabolomics.
  link: https://doi.org/10.1007/s11306-026-02406-8
- date: 2025-06-24
  title_pl: Startuje projekt OPUS 28 o długich niekodujących RNA
  title_en: OPUS 28 project on long non-coding RNAs starts
  text_pl: Rozpoczęliśmy realizację projektu NCN OPUS 28 kierowanego przez prof. dr hab. Anettę Kuczyńską. Przez cztery lata będziemy badać, jak długie niekodujące RNA regulują współdziałanie fitohormonów i szlaki sygnalizacji stresu u jęczmienia.
  text_en: We have started the NCN OPUS 28 project led by Prof. Anetta Kuczyńska. Over four years we will study how long non-coding RNAs regulate phytohormone crosstalk and stress signalling pathways in barley.
  link: https://projekty.ncn.gov.pl/?projekt_id=629631
